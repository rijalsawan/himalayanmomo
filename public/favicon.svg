<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="momoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E85D04"/>
      <stop offset="100%" style="stop-color:#D94F04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#momoGradient)" filter="url(#shadow)"/>
  
  <!-- Inner Circle Highlight -->
  <circle cx="256" cy="240" r="200" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  
  <!-- Momo/Dumpling Shape - Stylized -->
  <g transform="translate(256, 256)">
    <!-- Main dumpling body -->
    <ellipse cx="0" cy="20" rx="120" ry="80" fill="#FFF5E6" opacity="0.95"/>
    <ellipse cx="0" cy="20" rx="120" ry="80" fill="none" stroke="#FDF8F3" stroke-width="3"/>
    
    <!-- Pleats on top -->
    <path d="M-80,-20 Q-60,-50 -40,-30 Q-20,-50 0,-30 Q20,-50 40,-30 Q60,-50 80,-20" 
          fill="none" stroke="#E8D5C4" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Steam lines -->
    <g fill="none" stroke="#FFF" stroke-width="6" stroke-linecap="round" opacity="0.8">
      <path d="M-40,-60 Q-35,-80 -45,-100">
        <animate attributeName="d" 
          values="M-40,-60 Q-35,-80 -45,-100;M-40,-60 Q-50,-80 -40,-100;M-40,-60 Q-35,-80 -45,-100" 
          dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M0,-70 Q5,-90 -5,-110">
        <animate attributeName="d" 
          values="M0,-70 Q5,-90 -5,-110;M0,-70 Q-10,-90 5,-110;M0,-70 Q5,-90 -5,-110" 
          dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M40,-60 Q45,-80 35,-100">
        <animate attributeName="d" 
          values="M40,-60 Q45,-80 35,-100;M40,-60 Q30,-80 45,-100;M40,-60 Q45,-80 35,-100" 
          dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- M Letter Overlay (subtle) -->
  <text x="256" y="340" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="100" 
        font-weight="800" 
        fill="rgba(255,255,255,0.15)" 
        text-anchor="middle">M</text>
</svg>
