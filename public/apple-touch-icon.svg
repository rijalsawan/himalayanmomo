<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E85D04"/>
      <stop offset="100%" style="stop-color:#D94F04"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners for iOS -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Momo/Dumpling Shape -->
  <g transform="translate(90, 95)">
    <!-- Main dumpling body -->
    <ellipse cx="0" cy="8" rx="50" ry="32" fill="#FFF5E6"/>
    
    <!-- Pleats -->
    <path d="M-35,-8 Q-26,-22 -17,-12 Q-8,-22 0,-12 Q8,-22 17,-12 Q26,-22 35,-8" 
          fill="none" stroke="#E8D5C4" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Steam -->
    <g fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M-18,-25 Q-15,-35 -20,-45"/>
      <path d="M0,-30 Q3,-40 -3,-50"/>
      <path d="M18,-25 Q21,-35 16,-45"/>
    </g>
  </g>
</svg>
